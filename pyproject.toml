[project]
name = "2026_git_course"
version = "0.1.1"
description = "Teaching sandbox for the ICR Reproducible Software Development course"
requires-python = ">=3.10"

# ---------------------------------------------------------------------------
# Semantic versioning.
#
#   pip install bump-my-version
#   bump-my-version bump patch     0.1.0 -> 0.1.1
#   bump-my-version bump minor     0.1.1 -> 0.2.0
#   bump-my-version bump major     0.2.0 -> 1.0.0
#
# Note the naming: the package is `bump-my-version`, the config table is
# `[tool.bumpversion]`. (`bumpversion` / `bump2version` are the unmaintained
# predecessors — don't use those.)
# ---------------------------------------------------------------------------
[tool.bumpversion]
current_version = "0.1.1"
commit = true
tag = true
tag_name = "v{new_version}"
commit_args = "--no-verify"
message = "Bump version: {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

[tool.pytest.ini_options]
pythonpath = ["."]
